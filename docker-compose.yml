services:
  chaguan:
    # ghcr.io 不可达时改本地构建:注掉 image,放开 build
    image: ghcr.io/qiuyuxc/chaguan:${CHAGUAN_TAG:-latest}
    # build:
    #   context: .
    #   args:
    #     GOPROXY: https://goproxy.cn,direct
    #     BASE: scratch
    container_name: chaguan
    restart: unless-stopped
    ports:
      - "${CHAGUAN_PORT:-8080}:8080"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
