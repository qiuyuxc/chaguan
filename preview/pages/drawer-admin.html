<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>侧栏抽屉 · 管理员 · bbs 预览</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="drawer-demo">
  <div class="scrim"></div>
  <div class="drawer">
    <div class="side-card">
      <div class="user-card">
        <span class="avatar av-46 c1">站</span>
        <div class="uc-name">站长 <span class="badge badge-admin">管理员</span></div>
        <div class="uc-bio">折腾 VPS 与自托管服务的程序员,论坛第 1 位成员</div>
        <div class="uc-chips">
          <a class="uc-chip"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>128 帖</a>
          <a class="uc-chip"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>96 赞</a>
        </div>
      </div>
    </div>
    <div class="side-card">
      <div class="side-title">版块</div>
      <nav class="side-links">
        <a class="side-link"><span class="dot c1"></span>综合<span class="cnt">128</span></a>
        <a class="side-link"><span class="dot c2"></span>技术分享<span class="cnt">86</span></a>
        <a class="side-link"><span class="dot c5"></span>日常灌水<span class="cnt">45</span></a>
      </nav>
    </div>
    <div class="side-card">
      <div class="side-title">社区</div>
      <div class="side-stats">
        <div><b>72</b><span>成员</span></div>
        <div><b>289</b><span>主题</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
