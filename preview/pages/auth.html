<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>认证与表单 · bbs 预览</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <button class="icon-btn menu-btn" aria-label="菜单"><svg class="ic" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
  <a class="logo" href="../index.html"><span class="logo-mark"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>BBS</a>
  <button class="icon-btn" aria-label="搜索"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
  <div class="topbar-right">
    <button class="icon-btn" aria-label="通知"><svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
    <a class="btn btn-primary btn-sm"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><line x1="15" x2="3" y1="12" y2="12"/></svg>登录</a>
  </div>
</div></header>
<div class="layout"><main>
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span></div>
    <h1>欢迎回来</h1>
    <p class="auth-sub">登录 BBS,和朋友们继续讨论</p>
    <p class="form-error">用户名或密码不正确</p>
    <div class="form-grid" style="margin-top:14px">
      <label>用户名<input class="input" value="占位用户名"></label>
      <label>密码<input class="input" type="password" value="********"></label>
      <a class="btn btn-primary btn-block"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><line x1="15" x2="3" y1="12" y2="12"/></svg>登录</a>
    </div>
    <p class="hint">还没有账号?<a>注册</a></p>
  </div>
  <div class="auth-card">
    <div class="auth-brand"><span class="logo-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg></span></div>
    <h1>加入我们</h1>
    <p class="auth-sub">注册账号,参与讨论 · 首位注册用户自动成为管理员</p>
    <div class="form-grid">
      <label>用户名(2–24 字符)<input class="input" placeholder="支持中文"></label>
      <label>密码(至少 8 位)<input class="input" type="password"></label>
      <a class="btn btn-primary btn-block">注册</a>
    </div>
    <p class="hint">已有账号?<a>登录</a></p>
  </div>
  <div class="side-card" style="max-width:560px;margin:32px auto 0">
    <div class="side-title">发新帖 · 技术分享</div>
    <div class="form-grid">
      <label>标题<input class="input" placeholder="一句话说清主题"></label>
      <label>正文<textarea class="input textarea" rows="7" placeholder="支持多段落"></textarea></label>
      <div class="form-actions"><a class="btn btn-primary">发布</a><a class="btn btn-white">取消</a></div>
    </div>
  </div>
</main></div>
<div class="footer">Powered by bbs</div>
</body>
</html>
