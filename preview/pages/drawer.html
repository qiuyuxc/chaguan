<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>侧栏抽屉 · 未登录 · bbs 预览</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="drawer-demo">
  <div class="scrim"></div>
  <div class="drawer">
    <div class="side-card">
      <div class="side-title">你好啊,陌生人</div>
      <div class="user-card">
        <span class="avatar av-46" style="background:#dfe1e6;color:#98a0ab">?</span>
        <div class="uc-name">未登录</div>
        <div class="uc-bio">登录后即可发帖、回复与接收通知</div>
        <div class="uc-chips">
          <a class="uc-chip">登录</a>
          <a class="uc-chip">注册</a>
        </div>
      </div>
    </div>
    <div class="side-card">
      <div class="side-title">版块</div>
      <nav class="side-links">
        <a class="side-link on"><span class="dot c1"></span>综合<span class="cnt">128</span></a>
        <a class="side-link"><span class="dot c2"></span>技术分享<span class="cnt">86</span></a>
        <a class="side-link"><span class="dot c5"></span>日常灌水<span class="cnt">45</span></a>
        <a class="side-link"><span class="dot c3"></span>跳蚤市场<span class="cnt">30</span></a>
      </nav>
    </div>
    <div class="side-card">
      <div class="side-title">社区</div>
      <div class="side-stats">
        <div><b>72</b><span>成员</span></div>
        <div><b>289</b><span>主题</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
