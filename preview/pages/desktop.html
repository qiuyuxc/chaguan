<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 · 桌面 · bbs 预览</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="logo"><span class="logo-mark"><svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>BBS</a>
  <button class="icon-btn" aria-label="搜索"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
  <div class="topbar-right">
    <a class="btn btn-primary btn-sm"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>发帖</a>
    <button class="icon-btn" aria-label="通知"><svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
    <span class="avatar av-32 c1">站</span>
  </div>
</div></header>
<div class="layout">
  <aside class="sidebar">
    <div class="side-card">
      <div class="user-card">
        <span class="avatar av-46 c1">站</span>
        <div class="uc-name">站长 <span class="badge badge-admin">管理员</span></div>
        <div class="uc-bio">折腾 VPS 与自托管服务的程序员,论坛第 1 位成员</div>
        <div class="uc-chips">
          <a class="uc-chip"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>128 帖</a>
          <a class="uc-chip"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>96 赞</a>
        </div>
      </div>
    </div>
    <div class="side-card">
      <div class="side-title">版块</div>
      <nav class="side-links">
        <a class="side-link on"><span class="dot c1"></span>综合<span class="cnt">128</span></a>
        <a class="side-link"><span class="dot c2"></span>技术分享<span class="cnt">86</span></a>
        <a class="side-link"><span class="dot c5"></span>日常灌水<span class="cnt">45</span></a>
        <a class="side-link"><span class="dot c3"></span>跳蚤市场<span class="cnt">30</span></a>
      </nav>
    </div>
    <div class="side-card">
      <div class="side-title">社区</div>
      <div class="side-stats">
        <div><b>72</b><span>成员</span></div>
        <div><b>289</b><span>主题</span></div>
      </div>
    </div>
  </aside>
  <main>
    <div class="feed-tabs">
      <button class="feed-tab on">最新</button>
      <button class="feed-tab">热帖</button>
    </div>
    <div class="thread-card">
      <div class="tr">
        <span class="avatar av-40 c1">站</span>
        <div class="tr-main">
          <a class="tr-title">对邀请码发放机制的调整总结<span class="bcat bcat-1">公告</span></a>
          <div class="tr-meta"><span class="m">站长</span><span class="m">1 小时前</span></div>
        </div>
        <div class="tr-right">
          <div class="nums"><span><b>2.2万</b> 浏览</span><span><b>201</b> 回复</span></div>
          <div>Excelsior · 10 分钟前</div>
        </div>
      </div>
      <div class="tr">
        <span class="avatar av-40 c2">小</span>
        <div class="tr-main">
          <a class="tr-title">写了个小工具自动备份相册,分享一下思路<span class="bcat bcat-2">技术</span></a>
          <div class="tr-meta"><span class="m">小韩</span><span class="m">3 小时前</span></div>
        </div>
        <div class="tr-right">
          <div class="nums"><span><b>89</b> 浏览</span><span><b>5</b> 回复</span></div>
          <div>阿明 · 2 小时前</div>
        </div>
      </div>
      <div class="tr">
        <span class="avatar av-40 c4">韩</span>
        <div class="tr-main">
          <a class="tr-title">大家的软路由都分流了吗?<span class="bcat bcat-4">日常</span></a>
          <div class="tr-meta"><span class="m">老韩</span><span class="m">10 分钟前</span></div>
        </div>
        <div class="tr-right">
          <div class="nums"><span><b>489</b> 浏览</span><span><b>23</b> 回复</span></div>
          <div>himydear · 10 分钟前</div>
        </div>
      </div>
    </div>
    <nav class="pagi">
      <a class="pg on">1</a><a class="pg">2</a><a class="pg">3</a><a class="pg">…</a><a class="pg">100</a>
    </nav>
  </main>
</div>
<div class="footer">Powered by bbs</div>
</body>
</html>
