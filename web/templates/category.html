{{define "content"}}
<nav class="crumb"><a href="/">首页</a><svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg><span>{{.Category.Name}}</span></nav>
<div class="page-head">
  <div>
    <h1>{{.Category.Name}}</h1>
    {{if .Category.Description}}<p class="page-sub">{{.Category.Description}}</p>{{end}}
  </div>
  {{if .User}}
  <a class="btn btn-primary" href="/c/{{.Category.Slug}}/new">+ 发新帖</a>
  {{end}}
</div>

{{if .IsEmpty}}
<p class="empty">还没有主题,来发第一帖吧</p>
{{else}}
<div class="thread-card">
  {{range .Threads}}{{template "thread_row" .}}{{end}}
</div>
{{template "pagination" .}}
{{end}}
{{end}}
