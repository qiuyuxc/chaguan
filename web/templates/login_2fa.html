{{define "content"}}
<div class="auth-card">
  <div class="auth-brand"><span class="logo-mark"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span></div>
  <h1>两步验证</h1>
  <p class="auth-sub">输入验证器里当前的 6 位数字</p>
  {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
  <form method="post" action="/login/2fa" class="form-grid">
    {{csrfField .CSRF}}
    <label>验证码
      <input class="input tfa-code-lg" name="code" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" required autofocus placeholder="000000">
    </label>
    <button class="btn btn-primary btn-block" type="submit">验证并登录</button>
  </form>
  <p class="hint">换个账号?<a href="/login">回到登录</a></p>
</div>
{{end}}
