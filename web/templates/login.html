{{define "content"}}
<div class="auth-card">
  <div class="auth-brand"><span class="logo-mark"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span></div>
  <h1>欢迎回来</h1>
  <p class="auth-sub">登录 {{.Site.Name}},和朋友们继续讨论</p>
  {{if .Notice}}<p class="save-ok">{{.Notice}}</p>{{end}}
  {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
  {{if .Unverify}}<p class="hint auth-hint"><a href="/verify/resend">没收到验证邮件?点这里重发</a></p>{{end}}
  <form method="post" action="/login" class="form-grid">
    {{csrfField .CSRF}}
    <label>用户名<input class="input" name="name" value="{{.Name}}" required autofocus></label>
    <label>密码<input class="input" type="password" name="password" required></label>
    <button class="btn btn-primary btn-block" type="submit">
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
      登录
    </button>
  </form>
  <p class="hint">还没有账号?<a href="/register">注册</a> · <a href="/forgot">忘记密码</a></p>
</div>
{{end}}
