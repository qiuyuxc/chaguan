{{define "content"}}
<div class="page-head">
  <div>
    <h1>编辑回复</h1>
    <p class="page-sub">直接改写这条回复的正文</p>
  </div>
</div>
{{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
<form method="post" action="/p/{{.PostID}}/edit" class="form-grid compose-form">
  {{csrfField .CSRF}}
  <div class="compose-field">
    <span class="flabel">回复正文</span>
    {{template "composer" (dict "ID" "post-content" "Name" "content" "Rows" 8 "Placeholder" "写下这条回复…" "Content" .Content)}}
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">保存修改</button>
    <a class="btn btn-white" href="/t/{{.Thread.ID}}">取消</a>
  </div>
</form>
{{end}}
