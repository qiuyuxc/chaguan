{{define "content"}}
<div class="side-card compose-card">
  <div class="side-title">编辑回复</div>
  {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
  <form method="post" action="/p/{{.PostID}}/edit" class="form-grid">
    {{csrfField .CSRF}}
    <label>内容<textarea class="input textarea" name="content" maxlength="10000" required rows="8">{{.Content}}</textarea></label>
    <div class="upload-row">
      <button type="button" class="btn btn-outline btn-sm" data-upload="textarea[name=content]">插入图片</button>
      <input type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
      <span class="upload-status" aria-live="polite"></span>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">保存修改</button>
      <a class="btn btn-white" href="/t/{{.Thread.ID}}">取消</a>
    </div>
  </form>
</div>
{{end}}
