{{define "reacts"}}<span class="op-reacts" id="op-reacts">
  {{if .User}}
  <button type="button" class="react-btn{{if .LikedByMe}} on{{end}}" hx-post="/t/{{.Thread.ID}}/like" hx-target="#op-reacts" hx-swap="outerHTML" title="{{if .LikedByMe}}取消点赞{{else}}点赞这篇文章{{end}}" aria-label="{{if .LikedByMe}}取消点赞{{else}}点赞这篇文章{{end}}">
    <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    <b>{{.LikeCount}}</b>
  </button>
  <button type="button" class="react-btn fav-btn{{if .FavedByMe}} on{{end}}" hx-post="/t/{{.Thread.ID}}/favorite" hx-target="#op-reacts" hx-swap="outerHTML" title="{{if .FavedByMe}}取消收藏{{else}}收藏这个主题{{end}}" aria-label="{{if .FavedByMe}}取消收藏{{else}}收藏这个主题{{end}}">
    <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <b>{{.FavCount}}</b>
  </button>
  {{if .CanTip}}
  <span class="tip-wrap">
    <button type="button" class="react-btn tip-btn{{if .TipTotal}} has{{end}}" data-tip-toggle aria-expanded="false" title="用积分打赏作者" aria-label="打赏">
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
      {{if .TipTotal}}<b>{{pts .TipTotal}}</b>{{end}}
    </button>
    <span class="tip-pop" data-tip-pop hidden>
      <span class="tip-pop-t">
        打赏积分 · 我有 {{pts .MyPoints}}
        <button type="button" class="tip-x" data-tip-close title="关闭" aria-label="关闭">
          <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </span>
      <form hx-post="/t/{{.Thread.ID}}/tip" hx-target="#op-reacts" hx-swap="outerHTML" class="tip-amounts">
        {{csrfField .CSRF}}
        <button class="tip-amt" type="submit" name="amount" value="5">5</button>
        <button class="tip-amt" type="submit" name="amount" value="10">10</button>
        <button class="tip-amt" type="submit" name="amount" value="20">20</button>
        <button class="tip-amt" type="submit" name="amount" value="50">50</button>
      </form>
      <form hx-post="/t/{{.Thread.ID}}/tip" hx-target="#op-reacts" hx-swap="outerHTML" class="tip-custom">
        {{csrfField .CSRF}}
        <input class="input input-sm tip-input" type="number" name="amount" min="0.01" max="10000" step="0.01"
               placeholder="自定义" aria-label="自定义打赏积分">
        <button class="btn btn-primary btn-sm" type="submit">打赏</button>
      </form>
    </span>
  </span>
  {{else if .TipTotal}}
  <span class="react-note" title="该帖收到的打赏">
    <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
    <b>{{.TipTotal}}</b>
  </span>
  {{end}}
  {{else}}
  <span class="react-note" title="登录后可点赞、收藏、打赏">
    <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    <b>{{.LikeCount}}</b>
    <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <b>{{.FavCount}}</b>
    {{if .TipTotal}}
    <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="13" x="3" y="8" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
    <b>{{.TipTotal}}</b>
    {{end}}
  </span>
  {{end}}
</span>{{end}}
