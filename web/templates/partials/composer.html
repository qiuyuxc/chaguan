{{define "composer"}}
<div class="composer" data-composer>
  <div class="composer-quote" data-composer-quote hidden>
    <span class="cq-badge">引用</span>
    <span class="cq-text" data-cq-text></span>
    <button type="button" class="cq-x" data-cq-clear title="取消引用" aria-label="取消引用">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
    </button>
  </div>
  <textarea class="input textarea composer-input" name="{{.Name}}" id="{{.ID}}" maxlength="10000" rows="{{.Rows}}" required placeholder="{{.Placeholder}}">{{.Content}}</textarea>
  <div class="composer-panels">
    <div class="cp-panel cp-emoji" data-panel="emoji" hidden></div>
    <div class="cp-panel cp-icons" data-panel="icons" hidden></div>
    <div class="cp-panel cp-at" data-panel="at" hidden>
      <input class="input cp-at-input" type="search" placeholder="搜索用户名,如: admin" autocomplete="off">
      <div class="cp-at-results"></div>
    </div>
  </div>
  <div class="composer-bar">
    <button type="button" class="c-btn" data-compose="upload" title="插入图片" aria-label="插入图片">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <button type="button" class="c-btn" data-panel-toggle="at" title="提及用户" aria-label="提及用户">@</button>
    <button type="button" class="c-btn" data-panel-toggle="emoji" title="表情" aria-label="表情">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
    </button>
    <button type="button" class="c-btn" data-panel-toggle="icons" title="常用图标" aria-label="常用图标">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
    </button>
    {{if .Redpack}}<button type="button" class="c-btn" data-rp-toggle title="发红包" aria-label="发红包" aria-expanded="false">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="13" x="3" y="8" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
    </button>{{end}}
    <input type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
    <span class="upload-status" aria-live="polite"></span>
    {{if .Send}}<button class="c-send" type="submit" title="发送回复(Ctrl+Enter)" aria-label="发送回复">
      <svg class="ic ic-sm" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 10 4 15 9 20"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>
    </button>{{end}}
  </div>
</div>
{{end}}
